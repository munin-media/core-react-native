name: Publish Package

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Configure registry auth
        run: |
          yarn config set npmScopes.munin-media.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.munin-media.npmAlwaysAuth true
          yarn config set npmScopes.munin-media.npmAuthToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Build
        run: yarn build

      - name: Publish to GitHub Packages
        run: npm publish --access public --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
